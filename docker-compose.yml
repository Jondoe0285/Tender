# Local development database only. Production runs on Render PostgreSQL.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tender-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tender_dev
    ports:
      - '5432:5432'
    volumes:
      - tender-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tender -d tender_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tender-postgres-data:
