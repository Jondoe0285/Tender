name: CI

on:
  pull_request:
    branches: [ main, staging, development ]
  push:
    branches: [ main, staging, development ]

jobs:
  validate:
    name: Lint, type-check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tender:tender@localhost:5432/tender_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://tender:tender@localhost:5432/tender_test?schema=public
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000
      RESEND_API_KEY: test-key
      EMAIL_FROM: no-reply@example.com
      # Blank so tests exercise the dev-mode payment confirmation fallback instead of calling Stripe.
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      RETENTION_JOB_SECRET: test-secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: tender
          POSTGRES_DB: tender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Keeps CI builds off the source map upload path.
          SENTRY_AUTH_TOKEN: ''
