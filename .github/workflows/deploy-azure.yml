name: Deploy to Azure App Service

# Break-glass manual deployment, retained for emergency use only.
# The routine, gated release path is deploy-production.yml. The push trigger was removed so that
# merging to main is no longer the same action as releasing to production.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Azure deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read

    steps:
      - name: Confirm credentials are configured
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$WEBAPP_NAME" ] || [ -z "$CREDENTIALS" ]; then
            echo "::error::Deployment is not configured. AZURE_WEBAPP_NAME and AZURE_CREDENTIALS are required."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy application to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .
